<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Urban Arrhythmia — Contact</title>
<style>
/* Gerrythmia — shared styles */
:root{
  --paper:#ffffff;
  --ink:#1a1a1a;
  --ink-soft:#5c5c5c;
  --line:#e3e3e3;
  --accent:#0f7a5a;
  --bezel:#ededed;
  --bezel-edge:#cccccc;
  --screen:#20242a;
  --screen-2:#171a1f;
  --grid:rgba(120,150,140,0.09);
  --stable:#37f5a6;
  --warning:#ffc24d;
  --critical:#ff5468;
  --cyan:#5fd7ea;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"JetBrains Mono",monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
body{min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;}

/* top nav */
.nav{
  display:flex;align-items:center;gap:26px;
  padding:20px clamp(20px,5vw,64px);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);z-index:20;
}
.nav .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:15px;text-transform:uppercase;}
.nav .brand .beat{color:var(--critical);}
.nav .links{display:flex;gap:22px;margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
.nav .links a{color:var(--ink-soft);text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s;}
.nav .links a:hover{color:var(--ink);}
.nav .links a.active{color:var(--ink);border-color:var(--ink);}

.wrap{max-width:1100px;width:100%;margin:0 auto;padding:clamp(28px,5vw,60px) clamp(20px,5vw,64px);flex:1;display:flex;flex-direction:column;justify-content:center;}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--ink-soft);}
h1.title{font-size:clamp(38px,7vw,76px);letter-spacing:.02em;line-height:.98;margin:10px 0 18px;font-weight:700;}
h2{font-size:clamp(22px,3vw,30px);margin:46px 0 14px;letter-spacing:.01em;}
h3{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;}
p.lead{font-size:clamp(17px,2vw,21px);line-height:1.55;max-width:66ch;color:#333333;}
p{font-size:16px;line-height:1.6;max-width:66ch;color:#333333;margin:12px 0;}
em{font-style:italic;}
.muted{color:var(--ink-soft);}
.rule{height:1px;background:var(--line);margin:40px 0;border:0;}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 20px;border:1px solid var(--ink);border-radius:2px;text-decoration:none;
  background:var(--ink);color:var(--paper);transition:.2s;
}
.btn:hover{background:transparent;color:var(--ink);}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.ghost:hover{background:var(--ink);color:var(--paper);}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:0;}
.card{border:1px solid var(--line);border-radius:6px;padding:22px;background:#fafafa;}
.card .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle;box-shadow:0 0 8px currentColor;}
.card h4{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.card p{font-size:14.5px;margin:0;color:var(--ink-soft);}

footer.foot{border-top:1px solid var(--line);margin-top:auto;padding:26px clamp(20px,5vw,64px);font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

</style>
</head>
<body>
  <nav class="nav">
    <span class="brand">URBAN ARRHYTHMIA</span>
    <span class="links">
      <a href="index.html">Overview</a>
      <a href="map.html">Map</a>
      <a href="monitor.html">Monitor</a>
      <a href="contact.html" class="active">Contact</a>
    </span>
  </nav>

  <div class="wrap">
    <div class="cards">
      <div class="card">
        <h4>Email</h4>
        <p><a href="mailto:mwang41@pratt.edu" style="color:var(--accent);text-decoration:none;font-weight:600">mwang41@pratt.edu</a></p>
      </div>
      <div class="card">
        <h4>LinkedIn</h4>
        <p><a href="https://www.linkedin.com/in/alex-mt-wang" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600">linkedin.com/in/alex-mt-wang</a></p>
      </div>
      <div class="card">
        <h4>GitHub</h4>
        <p><a href="https://github.com/alexwang-data" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:600">github.com/alexwang-data</a></p>
      </div>
    </div>
  </div>

  <footer class="foot">
    <span>URBAN ARRHYTHMIA</span>
    <span>Alex Wang &bull; Pratt Institute</span>
  </footer>
</body>
