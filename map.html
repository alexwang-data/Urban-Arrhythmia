<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New York City Council Districts — Urban Arrhythmia NYC</title>
<style>
  :root{
    --paper:#ffffff; --ink:#1a1a1a; --ink-soft:#5c5c5c; --line:#e3e3e3;
    --stable:#37f5a6; --warning:#ffc24d; --critical:#ff5468; --cyan:#5fd7ea;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"JetBrains Mono",monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);}
  a{color:inherit;}

  .nav{display:flex;align-items:center;gap:26px;padding:20px clamp(20px,5vw,64px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);z-index:30;}
  .nav .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:15px;text-transform:uppercase;color:var(--ink);}
  .nav .links{display:flex;gap:22px;margin-left:auto;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;}
  .nav .links a{color:var(--ink-soft);text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s;}
  .nav .links a:hover{color:var(--ink);}
  .nav .links a.active{color:var(--ink);border-color:var(--ink);}


  .stage{width:100%;max-width:1360px;margin:0 auto;padding:26px clamp(20px,5vw,54px) 16px;
    display:grid;grid-template-columns:186px minmax(0,1fr) 360px;gap:30px;align-items:start;}
  @media (max-width:940px){ .stage{grid-template-columns:1fr;} }

  /* left rail: small title + colour toggles */
  .rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:20px;}
  .railtitle{font-size:19px;line-height:1.2;letter-spacing:-0.01em;font-weight:700;margin:0;}
  @media (max-width:940px){ .rail{position:static;} }

  /* map column */
  .mapwrap{position:relative;min-width:0;margin-top:48px;}
  .toolbar{display:flex;flex-direction:column;align-items:stretch;gap:7px;}
  .mode{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:9px 12px;border:1px solid var(--line);
    background:none;border-radius:5px;cursor:pointer;color:var(--ink-soft);transition:.15s;text-align:left;}
  .mode:hover{border-color:var(--ink-soft);color:var(--ink);}
  .mode.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  @media (max-width:940px){ .toolbar{flex-direction:row;flex-wrap:wrap;} .mode{text-align:center;} }
  svg.map{width:100%;height:auto;overflow:visible;display:block;}
  svg.map path{stroke:#fff;stroke-width:0.9;stroke-linejoin:round;cursor:pointer;transition:fill .25s,opacity .15s;}
  svg.map path:hover{opacity:.78;}
  .maptip{position:fixed;z-index:60;pointer-events:none;background:#12161b;color:#eef4ef;
    font-family:var(--mono);font-size:11px;line-height:1.4;padding:7px 10px;border-radius:5px;white-space:nowrap;
    transform:translate(-50%,-145%);box-shadow:0 8px 20px -6px rgba(0,0,0,.4);opacity:0;transition:opacity .1s;}
  .maptip.show{opacity:1;}
  .maptip .tv{color:var(--cyan);font-weight:700;}
  svg.map path.sel{stroke:var(--ink);stroke-width:2.4;}

  .scale{display:flex;align-items:center;gap:2px;margin-top:16px;flex-wrap:wrap;min-height:14px;}
  .scale .sw{width:26px;height:11px;display:inline-block;}
  .scale .ends{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin:0 8px;letter-spacing:.04em;}
  .scaledesc{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:9px;letter-spacing:.03em;line-height:1.5;min-height:3em;}

  /* panel column */
  .panel[hidden]{display:none;}
  .panel{position:sticky;top:96px;margin-top:44px;border:1px solid var(--line);border-radius:8px;padding:22px 22px 24px;}
  @media (max-width:940px){ .panel{margin-top:0;} }
  .panel .hint{color:var(--ink-soft);font-size:14px;line-height:1.6;}
  .pnum{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}
  .pname{font-size:30px;font-weight:700;letter-spacing:-0.01em;margin:2px 0 2px;}
  .pcompact{display:inline-flex;align-items:center;gap:9px;text-decoration:none;margin-top:2px;}
  .pcl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .pstatus{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 9px;border-radius:4px;color:#0b0e0c;}
  .pcompact:hover .pstatus{filter:brightness(1.05);}
  .pcompact:hover .pcl{color:var(--ink);}
  .prow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);}
  .prow:last-child{border-bottom:none;}
  .prow .k{font-size:13px;color:var(--ink-soft);}
  .prow .v{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right;}
  .prow .v small{font-weight:400;color:var(--ink-soft);}
  .psub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    margin:20px 0 4px;}
  .est{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--warning);border:1px solid var(--warning);
    border-radius:3px;padding:1px 5px;text-transform:uppercase;vertical-align:middle;margin-left:6px;}
  /* race bar */
  .racebar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:10px 0 8px;}
  .racebar i{display:block;height:100%;}
  .racekey{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:6px;}
  .racekey span{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;}
  .racekey b{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .caveat{font-size:11.5px;line-height:1.55;color:var(--ink-soft);margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .caveat b{color:var(--ink);font-weight:600;}
  .openbtn{display:inline-block;margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;text-decoration:none;color:var(--ink);border:1px solid var(--ink);border-radius:5px;
    padding:9px 14px;transition:.15s;}
  .openbtn:hover{background:var(--ink);color:#fff;}

  footer{border-top:1px solid var(--line);margin-top:0;padding:18px clamp(20px,5vw,54px);
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-soft);flex-wrap:wrap;gap:10px;}
</style>

    if(mode==='deviation'){
      scaleEl.innerHTML='<span class="ends">−5% under</span>'+DIV.map(c=>sw(c)).join('')+'<span class="ends">+5% over</span>';
      descEl.textContent='Population above or below the ideal district size (~172,600). Districts must be near-equal in population by law. 2020 Decennial Census.';
    } else if(mode==='rent'){
      scaleEl.innerHTML=`<span class="ends">${RANGES.rent[0].toFixed(0)}%</span>`+SEQ.map(c=>sw(c)).join('')+`<span class="ends">${RANGES.rent[1].toFixed(0)}%</span>`;
      descEl.textContent='Share of renter households paying 30%+ of income on rent. ACS 2019–2023 estimate.';
    } else if(mode==='race'){
      scaleEl.innerHTML=RACE.map(r=>`<span class="ends"><span class="sw" style="width:11px;background:${r.c}"></span> ${r.label}</span>`).join('');
      descEl.textContent='Each district coloured by its largest group by population. 2020 Decennial Census.';
    }
  }

  // ---- panel ----
  const panel=document.getElementById('panel');
  function preview(num){ panel.innerHTML=renderPanel(num,true); }
  function select(num){
    selected=num;
    panel.hidden=false;
    Object.values(paths).forEach(p=>p.classList.remove('sel'));
    paths[num].classList.add('sel');
    panel.innerHTML=renderPanel(num,false);
  }
  function renderPanel(num,isPreview){
    const d=DEMO[num], band=bandOf(PPCOR[num].ppCor);
    const racebar=RACE.map(r=>`<i style="width:${d[r.k]}%;background:${r.c}"></i>`).join('');
    const racekey=RACE.map(r=>`<span><b style="background:${r.c}"></b>${r.label} ${pct(d[r.k])}</span>`).join('');
    const dev=d.deviation_pct, devs=(dev>0?'+':'')+dev.toFixed(1)+'%';
    return `
      <div class="pnum">District ${num}</div>
      <div class="pname">${fmt(d.total)}<span style="font-size:14px;color:var(--ink-soft);font-weight:400"> residents</span></div>
      <a class="pcompact" href="monitor.html?d=${num}"><span class="pcl">Compactness</span><span class="pstatus" style="background:${COL[band]}">${statusText[band]} →</span></a>

      <div class="psub">Representation</div>
      <div class="prow"><span class="k">Deviation from Ideal</span><span class="v">${devs}</span></div>
      <div class="prow"><span class="k">Voting-Age Population</span><span class="v">${fmt(d.vap_total)} <small>${(100*d.vap_total/d.total).toFixed(0)}%</small></span></div>

      <div class="psub">Population by Race</div>
      <div class="racebar">${racebar}</div>
      <div class="racekey">${racekey}</div>

      <div class="psub">Economic Conditions <span class="est">ACS est.</span></div>
      <div class="prow"><span class="k">Poverty Rate</span><span class="v">${pct(d.poverty_pct)}</span></div>
      <div class="prow"><span class="k">Rent Burdened (30%+)</span><span class="v">${pct(d.rent_burden_pct)}</span></div>
      <div class="prow"><span class="k">Bachelor's or Higher</span><span class="v">${pct(d.educ_pct)}</span></div>

    `;
  }

  // ---- toolbar ----
  document.querySelectorAll('.mode').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); mode=b.dataset.mode; repaint();
    });
  });

  repaint();
})();
</script>
</body>
</html>
